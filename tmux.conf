set -g status-style 'bg=#9c6644 fg=#c0fdff'
set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/Personal/todo.md"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux/tmux-sessionizer.sh"
bind-key -r G run-shell "~/.local/bin/tmux-sessionizer ~/Work/freelance"

set -g renumber-windows on

set -g status-right "[#(whoami)@#H] %Y-%m-%d %H:%M"
